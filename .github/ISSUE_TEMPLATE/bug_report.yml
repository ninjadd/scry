name: Bug Report
description: Create a report to help us fix a bug in Scry
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible to help us reproduce and fix the bug.

  - type: input
    id: php_version
    attributes:
      label: PHP Version
      description: What version of PHP are you running?
      placeholder: "e.g., 8.2.14, 8.3.2, 8.4"
    validations:
      required: true

  - type: input
    id: laravel_version
    attributes:
      label: Laravel Version
      description: What version of Laravel is installed in your application?
      placeholder: "e.g., 10.42.0, 11.0.1, 12.x"
    validations:
      required: true

  - type: input
    id: db_engine_version
    attributes:
      label: Database Engine & Version
      description: Which database engine and exact version are you querying with Scry?
      placeholder: "e.g., PostgreSQL 16.1, MySQL 8.0.35, MariaDB 10.11, SQLite 3.42"
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: Describe the exact steps to reproduce the issue.
      placeholder: |
        1. Navigate to '/scry'
        2. Select PostgreSQL connection
        3. Click on table 'users'
        4. See error...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: false

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior / Error Logs
      description: Include any relevant browser console logs, PHP stack traces, or screenshots.
    validations:
      required: false

  - type: checkboxes
    id: asset_confirmation
    attributes:
      label: Assets Confirmation
      description: Scry requires updated Vue SPA frontend assets to function properly.
      options:
        - label: I confirm I have published the latest Vue assets using `php artisan vendor:publish --tag=scry-assets`
          required: true
