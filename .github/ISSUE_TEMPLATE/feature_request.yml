name: Feature Request
description: Suggest an idea or new feature for Scry
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please provide details about your idea and how it would benefit Scry users.

  - type: textarea
    id: feature_description
    attributes:
      label: Feature Description
      description: Describe the feature you would like to see added to Scry.
      placeholder: "Clear and concise description of the proposed feature..."
    validations:
      required: true

  - type: textarea
    id: problem_solved
    attributes:
      label: Problem or Use Case
      description: What problem does this feature solve? Is your feature request related to a specific problem or workflow?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / Implementation Details
      description: Describe how you envision this working or any architectural thoughts.
    validations:
      required: false

  - type: dropdown
    id: pr_willingness
    attributes:
      label: Are you willing to submit a Pull Request?
      description: Would you be willing to build this feature and submit a PR to `scry/scry`?
      options:
        - "Yes, I am willing to build this feature and submit a PR."
        - "Yes, but I would need some guidance from maintainers."
        - "No, I am just submitting the feature request."
    validations:
      required: true
