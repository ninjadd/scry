version: '3.8'

services:
  # ----------------------------------------
  # PostgreSQL Container (Primary Target)
  # ----------------------------------------
  pgsql:
    image: postgres:16
    container_name: scry_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: scry_user
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: scry_pg_db
    volumes:
      - scry_pg_data:/var/lib/postgresql/data
    networks:
      - scry_network

  # ----------------------------------------
  # MySQL Container (Secondary Target)
  # ----------------------------------------
  mysql:
    image: mysql:8.0
    container_name: scry_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_USER: scry_user
      MYSQL_PASSWORD: secret_password
      MYSQL_DATABASE: scry_my_db
      MYSQL_ROOT_PASSWORD: secret_root_password
    volumes:
      - scry_my_data:/var/lib/mysql
    networks:
      - scry_network

volumes:
  scry_pg_data:
  scry_my_data:

networks:
  scry_network:
    driver: bridge
